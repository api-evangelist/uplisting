meters:
- name: active_listings
  description: Active properties (listings) under management, billed per listing per month.
  unit: listings
  aggregation: max
  dimensions:
  - account
- name: account_minimum
  description: Monthly account minimum applied to smaller accounts (under 5 properties).
  unit: months
  aggregation: sum
  dimensions:
  - account
- name: protect_addon
  description: Automated security-deposit add-on, billed per listing where enabled.
  unit: listings
  aggregation: max
  dimensions:
  - account
- name: api_requests
  description: Public and Partner API calls - unmetered and included in the subscription (no separate charge).
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - partner
principles:
- name: Visibility
  description: Track active listing count month over month, since that is the primary billing driver; watch which listings have paid add-ons enabled.
- name: Allocation
  description: Map listings to owners / property portfolios so the per-listing subscription maps to internal cost centers.
- name: Optimization
  description: Deactivate listings no longer under management to stop per-listing charges; enable add-ons only on listings that need them; evaluate annual billing for a discount once listing count is stable.
- name: Accountability
  description: Assign an owner to the Uplisting subscription; review the listing count and add-on enablement against the invoice each month.
