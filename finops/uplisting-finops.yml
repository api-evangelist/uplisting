description: >-
  FinOps view of Uplisting spend. Uplisting bills as a per-listing monthly SaaS
  subscription rather than as a metered API. The dominant cost driver is the
  number of active listings (properties) under management, subject to a monthly
  account minimum, plus optional per-listing add-ons (for example Protect
  automated deposits). Annual billing trades a discount for an up-front annual
  commitment. The Public and Partner API is included with a subscription and has
  no separate per-call charge, so API usage does not add a metered line item -
  cost scales with listings, not requests.
notes: >-
  Per-unit prices are approximate and not reconciled here; verify current
  per-listing rates, the account minimum, and add-on pricing at
  https://www.uplisting.io/pricing. Because the API itself is unmetered, FinOps
  attention is on listing count and add-on enablement, not call volume.
